server {
    listen 80 default;

    client_max_body_size 108M;

    access_log /var/log/nginx/application.access.log;


    root /application/public;
    index index.php;

    # Disable access to .htaccess file used for Apache setups.
    location = /.htaccess {
        deny all;
        return 404;
    }

    # Front controller. try_files replaces the old `if (!-e $request_filename)` rewrite,
    # which nginx documents as unsafe inside a server block and which dropped the query
    # string on some request shapes.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/application_php_errors.log";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

}
